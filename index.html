 <!DOCTYPE html>
    <html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Minha Biblioteca De Jogos</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        
        <header>

                <line x1="6" x2="10" y1="11" y2="11"/>
                <line x1="8" x2="8" y1="9" y2="13"/>
                <line x1="15" x2="15.01" y1="12" y2="12"/>
                <line x1="18" x2="18.01" y1="10" y2="10"/>

            </svg>
            <h1>Minha Biblioteca <br>de <span class = "roxear">Jogos</span> </h1> 
            </div>

            <nav id = "botoes" class="botoes"> 
                <a href="#footer" class="btn-estilizado">Informações</a>
                <a href="#login" id = "loginGoogle"class="btn-estilizado">Login</a>
                <a href="#sair" id = "sair"class="btn-estilizado">sair</a>

            </nav>  

        </header>

        <main id="appPrincipal">
            <section class = "jogos">
                <div class = "titulos">
                    <h1> JOGOS</h1>
                </div>
                <article class="adicionarJogos"> 
                    <button class = "btn-mais">
                        <p> + </p>
                    </button>   
                </article>
            </section>    
              <section class = "jogando">
                <div class = "titulos">
                    <h1> JOGANDO</h1>
                </div>
                <article class="adicionarJogos"> 
                    <button class = "btn-mais">
                        <p> + </p>
                    </button>
                </article>
            </section>  

              <section class = "abandonado">
                <div class = "titulos">
                    <h1> ABANDONADO</h1>
                </div>
                <article class="adicionarJogos"> 
                    <button class = "btn-mais">
                        <p> + </p>
                    </button>
                    
                </article>
            </section>    

              <section class = "jogado">
                <div class = "titulos">
                    <h1> JOGADO</h1>
                </div>
                <article class="adicionarJogos"> 
                    <button class = "btn-mais">
                        <p> + </p>
                    </button>
                    
                </article>
            </section>   

              <section class = "tenhoInteresse">
                <div class = "titulos">
                    <h1> TENHO INTERESSE</h1>
                </div>
                <article class="adicionarJogos">
                    <button class = "btn-mais">
                        <p> + </p>
                    </button> 
                    
                </article>
            </section>   
            
        </main>
    
        <footer id = "footer">  
            <p> Rodapé. Informações sobre o site e tals </p> 
        </footer>
     
      

        <div class = "janelaAdicionar" data-modo="criar">
            <h2 class = "tituloJogo"> adicione o jogo</h2>
        
            <div class = "janelinha">
                
             
                <img class = "capaJogo" src = "cinza.jpg">
                <!--  --> 
                <div class="inputs">
                    <input type="text" id = "titulo" placeholder="Título">
                    <input type="text" id = "descricao" placeholder="descrição">

                    <select name = "status" class = "status">
                        <option selected disabled> status </option>
                        <option value = "jogado"> Jogado </option>
                        <option value = "jogando">Jogando </option>
                        <option value = "abandonado"> Abandonado </option>
                        <option value = "interesse"> Tenho interesse </option>
                    </select>

                    <select class = "numeros">
                        <option selected disabled> nota </option>
                    </select>

                </div>
            
            </div>

            <div class = "botoes">
                <button id = "btn-salvar-janelaJogos"> salvar </button>
                
                <button id = "btn-cancelar-janelaJogos">cancelar</button>
                <button id = "btn-excluir-janelaJogos">excluir</button>
            </div>

        </div>
        

          <script src="arquivo.js" type = "module"></script>

    </body>

</html>
